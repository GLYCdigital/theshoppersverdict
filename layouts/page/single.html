{{ define "main" }}
<section class="category-hero"{{ with .Params.hero_image }} style="background: linear-gradient(135deg, rgba(27,27,47,0.92), rgba(27,27,47,0.7)), url('{{ . }}') center/cover no-repeat;"{{ else }} style="background-color: var(--navy);"{{ end }}>
  <div class="container category-hero-inner">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}
    <p class="category-desc">{{ . }}</p>
    {{ end }}
  </div>
</section>

<article class="page-single">
  <div class="container">
    <div class="page-body">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
