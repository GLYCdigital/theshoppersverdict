<div class="review-verdict-badge" itemprop="reviewRating" itemscope itemtype="https://schema.org/Rating">
  <span class="review-verdict-score" itemprop="ratingValue">{{ .Get 0 }}</span>
  <span class="review-verdict-label">/ 5 — The Shopper's Verdict</span>
  <meta itemprop="bestRating" content="5">
  <meta itemprop="worstRating" content="1">
</div>
