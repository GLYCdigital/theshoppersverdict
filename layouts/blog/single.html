{{ define "main" }}
<article class="blog-single">
  <div class="container">
    <nav class="breadcrumb">
      <a href="/">Home</a>
      <span>→</span> <a href="/blog/">Blog</a>
      <span>→</span> <span class="current">{{ .Title }}</span>
    </nav>

    <header class="blog-single-header">
      {{ with .Params.blog_category }}
      <span class="blog-category">{{ . }}</span>
      {{ end }}
      <h1>{{ .Title }}</h1>
      <time class="blog-single-date">{{ .Date.Format "January 2, 2006" }}</time>
    </header>

    {{ with .Params.blog_image }}
    <div class="blog-single-image">
      <img src="{{ . }}" alt="{{ $.Title }}" loading="lazy">
    </div>
    {{ end }}

    <div class="blog-single-body">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
