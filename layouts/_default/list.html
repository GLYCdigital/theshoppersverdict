{{ define "main" }}
<section class="category-hero" style="background-color: var(--navy);">
  <div class="container category-hero-inner">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}
    <p class="category-desc">{{ . }}</p>
    {{ end }}
  </div>
</section>

<section class="category-content">
  <div class="container">
    <div class="category-toolbar">
      <span class="result-count">{{ len .Pages }} verdicts</span>
    </div>
    <div class="review-grid">
      {{ range .Pages.ByTitle }}
        {{ partial "review-card.html" . }}
      {{ end }}
    </div>
    {{ template "_internal/pagination.html" . }}
  </div>
</section>
{{ end }}
