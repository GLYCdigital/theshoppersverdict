<div class="site-header-sticky">
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="{{ .Site.Params.assets.logo | absURL }}" alt="{{ .Site.Params.brand }}" width="138" height="138">
      </a>
      <nav class="nav-primary" id="mainNav">
        <ul>
          {{ range .Site.Menus.main }}
          <li><a href="{{ .URL }}"{{ if hasPrefix $.Page.RelPermalink .URL }} class="active"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>

      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="sub-header">
    <div class="container sub-header-inner">
      <span class="sub-header-text">🔍 10,000+ Reviews Analyzed</span>
      <span class="sub-header-text">⚖️ Unbiased Verdicts</span>
      <span class="sub-header-text">🏆 Updated Weekly</span>
    </div>
  </div>

  <div class="sub-header-white">
    <div class="container sub-header-white-inner">
      <p class="promo-text">📬 Never miss a verdict — <a href="/newsletter/">subscribe to our newsletter</a> and get the latest reviews delivered to your inbox.</p>
    </div>
  </div>
</div>

<script>
document.getElementById('hamburger')?.addEventListener('click', function() {
  document.getElementById('mainNav').classList.toggle('open');
  this.classList.toggle('open');
});
</script>
