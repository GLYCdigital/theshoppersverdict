{{ define "main" }}
<section class="category-page">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a>
      <span>→</span>
      <span class="current">Best Of</span>
    </nav>
    <h1>Best Product Roundups</h1>
    <p class="category-desc">Curated lists of the best products in every category — based on real customer reviews.</p>
  </div>
</section>

<!-- Featured Picks (same 3 sections as main page) -->
<section class="featured-picks">
  <div class="container">
    <div class="picks-header">
      <span class="picks-overline">TRUSTED REVIEWS</span>
      <h2 class="section-title">TOP RATED PRODUCTS</h2>
    </div>
    <div class="picks-columns">
      <!-- Col 1: TODAY'S TOP PICK — rotated daily from 5-star pool -->
      <noscript>
      <div class="picks-col">
        <span class="picks-col-badge">🏆 TODAY'S TOP PICK</span>
        {{ range where (where .Site.RegularPages "Params.amazon_rating" ">=" 5) "Type" "in" (slice "kitchen" "coffee" "home-office" "home-improvement" "luxury-beauty" "pet-supplies" "furniture" "patio-lawn-garden" "sports-fitness" "toys-games") | first 3 }}
        <div class="pick-row">
          <a href="{{ .RelPermalink }}" class="pick-img-link">
            <div class="pick-img{{ if not .Params.amazon_image }} pick-img-placeholder{{ end }}">
              {{ with .Params.amazon_image }}<img src="{{ replace . "_SL1500_" "_SL300_" }}" alt="{{ $.Title }}" class="pick-img-fill" loading="lazy">{{ end }}
            </div>
          </a>
          <div class="pick-info">
            <a href="{{ .RelPermalink }}" class="pick-name">{{ .Title }}</a>
            <span class="pick-verdict">{{ partial "stars.html" .Params.amazon_rating }} {{ .Params.amazon_rating }}/5</span>
          </div>
        </div>
        {{ else }}
        <div class="pick-row" style="justify-content:center;padding:20px 0;">
          <span class="pick-name" style="color:var(--muted);">No reviews yet</span>
        </div>
        {{ end }}
      </div>
      </noscript>

      <!-- Col 2: BEST OF THE WEEK — rotated weekly from 5-star pool -->
      <noscript>
      <div class="picks-col">
        <span class="picks-col-badge">⭐ BEST OF THE WEEK</span>
        {{ range where (where .Site.RegularPages "Params.amazon_rating" ">=" 5) "Type" "in" (slice "kitchen" "coffee" "home-office" "home-improvement" "luxury-beauty" "pet-supplies" "furniture" "patio-lawn-garden" "sports-fitness" "toys-games") | first 3 }}
        <div class="pick-row">
          <a href="{{ .RelPermalink }}" class="pick-img-link">
            <div class="pick-img{{ if not .Params.amazon_image }} pick-img-placeholder{{ end }}">
              {{ with .Params.amazon_image }}<img src="{{ replace . "_SL1500_" "_SL300_" }}" alt="{{ $.Title }}" class="pick-img-fill" loading="lazy">{{ end }}
            </div>
          </a>
          <div class="pick-info">
            <a href="{{ .RelPermalink }}" class="pick-name">{{ .Title }}</a>
            <span class="pick-verdict">{{ partial "stars.html" .Params.amazon_rating }} {{ .Params.amazon_rating }}/5</span>
          </div>
        </div>
        {{ else }}
        <div class="pick-row" style="justify-content:center;padding:20px 0;">
          <span class="pick-name" style="color:var(--muted);">No reviews this week</span>
        </div>
        {{ end }}
      </div>
      </noscript>

      <!-- Col 3: EDITOR'S FAVOURITE — 2 luxury-beauty + 1 five-star, rotated weekly -->
      <noscript>
      <div class="picks-col">
        <span class="picks-col-badge">❤️ EDITOR'S FAVOURITE</span>
        {{ $luxury := first 2 (where .Site.RegularPages "Type" "luxury-beauty") }}
        {{ $fivestar := first 1 (where (where .Site.RegularPages "Params.amazon_rating" ">=" 5) "Type" "ne" "luxury-beauty") }}
        {{ range $luxury }}
        <div class="pick-row">
          <a href="{{ .RelPermalink }}" class="pick-img-link">
            <div class="pick-img{{ if not .Params.amazon_image }} pick-img-placeholder{{ end }}">
              {{ with .Params.amazon_image }}<img src="{{ replace . "_SL1500_" "_SL300_" }}" alt="{{ $.Title }}" class="pick-img-fill" loading="lazy">{{ end }}
            </div>
          </a>
          <div class="pick-info">
            <a href="{{ .RelPermalink }}" class="pick-name">{{ .Title }}</a>
            <span class="pick-verdict">{{ partial "stars.html" .Params.amazon_rating }} {{ .Params.amazon_rating }}/5</span>
          </div>
        </div>
        {{ end }}
        {{ range $fivestar }}
        <div class="pick-row">
          <a href="{{ .RelPermalink }}" class="pick-img-link">
            <div class="pick-img{{ if not .Params.amazon_image }} pick-img-placeholder{{ end }}">
              {{ with .Params.amazon_image }}<img src="{{ replace . "_SL1500_" "_SL300_" }}" alt="{{ $.Title }}" class="pick-img-fill" loading="lazy">{{ end }}
            </div>
          </a>
          <div class="pick-info">
            <a href="{{ .RelPermalink }}" class="pick-name">{{ .Title }}</a>
            <span class="pick-verdict">{{ partial "stars.html" .Params.amazon_rating }} {{ .Params.amazon_rating }}/5</span>
          </div>
        </div>
        {{ end }}
      </div>
      </noscript>
    </div>
  </div>
</section>

<script>
(function() {
  var today = new Date();
  var start = new Date(today.getFullYear(), 0, 1);
  var dayOfYear = Math.floor((today - start) / 86400000) + 1;
  var weekNum = Math.ceil((((today - start) / 86400000) + start.getDay() + 1) / 7);

  fetch('/index.json')
    .then(function(r) { return r.json(); })
    .then(function(reviews) {
      if (!reviews || !reviews.length) return;

      // Filter pools
      var fiveStar = reviews.filter(function(r) {
        return parseFloat(r.rating) >= 5.0;
      });
      var luxury = reviews.filter(function(r) {
        return r.category === 'Luxury & Beauty';
      });

      // Col 1: TODAY'S TOP PICK — 3 per day from 5-star
      var todayStart = (dayOfYear * 3) % fiveStar.length;
      var todayPicks = [];
      for (var i = 0; i < 3; i++) {
        todayPicks.push(fiveStar[(todayStart + i) % fiveStar.length]);
      }

      // Col 2: BEST OF THE WEEK — 3 per week from 5-star
      var weekStart = (weekNum * 3) % fiveStar.length;
      var weekPicks = [];
      for (var i = 0; i < 3; i++) {
        weekPicks.push(fiveStar[(weekStart + i) % fiveStar.length]);
      }

      // Col 3: EDITOR'S FAVOURITE — 2 luxury + 1 five-star, per week
      var luxuryStart = (weekNum * 2) % luxury.length;
      var editorPicks = [];
      for (var i = 0; i < 2; i++) {
        editorPicks.push(luxury[(luxuryStart + i) % luxury.length]);
      }
      editorPicks.push(fiveStar[(weekNum + 5) % fiveStar.length]); // different offset for variety

      renderCol(0, todayPicks);
      renderCol(1, weekPicks);
      renderCol(2, editorPicks);
    })
    .catch(function() {});

  function renderCol(idx, picks) {
    var cols = document.querySelectorAll('#bestof-picks .picks-col');
    if (!cols.length) {
      cols = document.querySelectorAll('.picks-columns .picks-col');
    }
    // After noscript, find the right col (skip noscript hidden ones)
    var all = [];
    document.querySelectorAll('.picks-columns').forEach(function(pc) {
      pc.querySelectorAll('.picks-col').forEach(function(c) { all.push(c); });
    });
    var target = all[all.length - 3 + idx];
    if (!target) return;

    var html = '';
    var badges = ['🏆 TODAY\'S TOP PICK', '⭐ BEST OF THE WEEK', '❤️ EDITOR\'S FAVOURITE'];
    html += '<span class="picks-col-badge">' + badges[idx] + '</span>';

    for (var i = 0; i < picks.length; i++) {
      var r = picks[i];
      html += '<div class="pick-row">';
      html += '<a href="' + (r.permalink || '#') + '" class="pick-img-link">';
      html += '<div class="pick-img' + (r.image ? '' : ' pick-img-placeholder') + '">';
      if (r.image) html += '<img src="' + r.image.replace('_SL1500_', '_SL300_') + '" alt="' + esc(r.title) + '" class="pick-img-fill" loading="lazy">';
      html += '</div></a>';
      html += '<div class="pick-info">';
      html += '<a href="' + (r.permalink || '#') + '" class="pick-name">' + esc(r.title) + '</a>';
      if (r.rating) html += '<span class="pick-verdict">' + starsHTML(r.rating) + ' ' + r.rating + '/5</span>';
      html += '</div></div>';
    }

    target.innerHTML = html;
  }

  function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function starsHTML(rating) { var r = parseFloat(rating)||0, s=''; for(var i=0;i<Math.floor(r);i++) s+='&#9733;'; return s; }
})();
</script>
{{ end }}
