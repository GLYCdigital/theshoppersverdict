name: Setup Cloudflare Email Routing
on:
  workflow_dispatch:

jobs:
  setup-email:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Email Routing
        shell: bash
        run: |
          set +e  # Don't exit on error

          # Get zone ID for theshoppersverdict.com
          echo "=== Getting zone ID ==="
          ZONE_RESP=$(curl -s -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/zones?name=theshoppersverdict.com")
          echo "$ZONE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Success:', d.get('success')); print('Errors:', d.get('errors'))"
          ZONE_ID=$(echo "$ZONE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else 'NOT_FOUND')" 2>/dev/null)
          echo "Zone ID: $ZONE_ID"
          
          if [ "$ZONE_ID" = "NOT_FOUND" ] || [ -z "$ZONE_ID" ]; then
            echo "❌ Could not find zone"
            exit 1
          fi
          
          # Enable Email Routing
          echo "=== Enabling Email Routing ==="
          ENABLE_RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/enable" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "$ENABLE_RESP" | python3 -m json.tool
          
          # Get routing settings
          echo "=== Get routing settings ==="
          ROUTE_RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          echo "$ROUTE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Enabled:', d.get('result',{}).get('enabled'))"
          
          # Check existing destinations
          echo "=== Existing destinations ==="
          DEST_RESP=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/destinations" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          echo "$DEST_RESP" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('Success:', d.get('success'))
if d.get('result'):
    for r in d['result']:
        print(f\"  - {r.get('email')} (verified: {r.get('verified')})\")
else:
    print('No destinations')
    print('Errors:', d.get('errors'))
"