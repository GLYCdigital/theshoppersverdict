name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'
          extended: true

      - name: Pre-calculate stats (fast, avoids Hugo 26k-loop timeout)
        run: python3 scripts/calc_stats.py

      - name: Build
        run: hugo --minify

      - name: Build search index (single-file JSON, replaces Pagefind)
        run: python3 scripts/build_search_index.py


      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ecd6d8f6b5e56cccb482101a3ad6212d
        run: |
          npx --yes wrangler@4.113.0 pages deploy public \
            --project-name=theshoppersverdict \
            --branch=main

      - name: Purge CDN cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ecd6d8f6b5e56cccb482101a3ad6212d
        run: |
          echo "=== Pages project domains (raw) ==="
          curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/theshoppersverdict/domains" | head -c 2000
          echo ""
