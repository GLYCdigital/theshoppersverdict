name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'
          extended: true

      - name: Pre-calculate stats (fast, avoids Hugo 26k-loop timeout)
        run: python3 scripts/calc_stats.py

      - name: Build
        run: hugo --minify

      - name: Build search index (single-file JSON, replaces Pagefind)
        run: python3 scripts/build_search_index.py

      - name: Deploy budget gate (block if near 20K-file cap)
        run: |
          scripts/deploy_budget_check.sh || rc=$?
          rc=${rc:-0}
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Deploy budget warning — near 20K-file cap, plan a trim."
          elif [ "$rc" -ge 1 ]; then
            echo "::error::Deploy budget exceeded — trim taxonomy/archive pages or upgrade Cloudflare plan before pushing."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ecd6d8f6b5e56cccb482101a3ad6212d
        run: |
          npx --yes wrangler@4.113.0 pages deploy public \
            --project-name=theshoppersverdict \
            --branch=main

      - name: Purge CDN cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=theshoppersverdict.com" | \
            python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')" 2>/dev/null || echo "")
          if [ -n "$ZONE_ID" ]; then
            echo "Purging cache for zone $ZONE_ID"
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' | head -c 300
          else
            echo "Could not resolve zone ID — skipping purge"
          fi
