baseURL = "https://theshoppersverdict.com"
locale = "en-US"
title = "The Shopper's Verdict"
enableRobotsTXT = true
summaryLength = 25

# Disable default tag/category taxonomies — only 17 files use tags, and the
# generated taxonomy pages are orphaned (no template links to them) and count
# against the 20K Cloudflare Pages file cap. Sections handle categorization.
disableKinds = ["taxonomy", "taxonomyTerm"]

[taxonomies]
  tag = ""
  category = ""

[params]
  brand = "The Shopper's Verdict"
  tagline = "The final word on what to buy."
  description = "We read thousands of Amazon reviews so you don't have to. No fluff, just the verdict."
  color_navy = "#1B1B2F"
  color_gold = "#C9A84C"
  color_offwhite = "#F5F3EF"
  color_charcoal = "#1A1A2E"
  color_muted = "#6B6B7A"
  color_green = "#2D8A4E"

  [params.assets]
    logo = "/images/logo-icon.png"
    logo_icon = "/images/favicon.png"
    og_image = "/images/og-social.jpg"

  [params.affiliate]
    disclosure = "As an Amazon Associate, we earn from qualifying purchases. Our verdicts are based on real customer reviews, not affiliate commissions."
    tag = "tsvglyc-20"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  section = ["HTML", "RSS"]
  home = ["HTML", "RSS"]

[menu]
  [[menu.main]]
    name = "Verdicts"
    url = "/verdicts/"
    weight = 10
  [[menu.main]]
    name = "Best Of"
    url = "/best-of/"
    weight = 12
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 30

[permalinks]
  kitchen = "/kitchen/:slug/"
  coffee = "/coffee/:slug/"
  "home-office" = "/home-office/:slug/"
  "home-improvement" = "/home-improvement/:slug/"
  "luxury-beauty" = "/luxury-beauty/:slug/"
  "pet-supplies" = "/pet-supplies/:slug/"
  "furniture" = "/furniture/:slug/"
  "patio-lawn-garden" = "/patio-lawn-garden/:slug/"
  "sports-fitness" = "/sports-fitness/:slug/"
  "toys-games" = "/toys-games/:slug/"
